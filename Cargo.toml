[package]
name = "folio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
web-time = "1.1"
miniz_oxide = "0.8"
crc32fast = "1.4"

# Desktop app (macOS, Windows, Linux)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
rfd = "0.18.0"
winit = "0.30"

# Web / installable PWA (iPhone, iPad, any browser). WebGL renderer for wide device support.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Smaller download for the web app.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
