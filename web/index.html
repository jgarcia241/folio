<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fit the screen, no pinch-zoom of the whole app (the app has its own layout for phones). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Installable on iPhone / iPad ("Add to Home Screen") and Android. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <meta name="theme-color" content="#f7f7f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Folio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; overscroll-behavior: none; }
    #folio_canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #folio_loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #9b9a97; background: #fff; }
    #folio_loading.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="folio_canvas"></canvas>
  <div id="folio_loading">Loading Folio…</div>

  <!-- Cloud service app keys (Dropbox / OneDrive / Google Drive), then storage + sync. -->
  <script src="config.js"></script>
  <script src="sync.js"></script>

  <script type="module">
    import init, * as wasm from "./folio.js";

    async function start() {
      await init();
      window.folioWasm = wasm;
      // Hand every saved file to the app, then start it.
      const files = await window.folioHost.loadAll();
      for (const [path, v] of files) wasm.folio_preload(path, v.data, v.mtime || 0);
      const touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      wasm.folio_start("folio_canvas", touch);
      document.getElementById("folio_loading").classList.add("hidden");

      // Finish a cloud sign-in that just returned, or reopen the folder / cloud service used last time.
      window.folioHost.start().catch((e) => console.warn("sync:", e));

      // iPhone/iPad keyboard: shrink the app to the visible area so the text being
      // typed is never hidden behind the keyboard.
      const canvas = document.getElementById("folio_canvas");
      function fitVisible() {
        const vv = window.visualViewport;
        if (!vv) return;
        canvas.style.height = vv.height + "px";
        canvas.style.top = vv.offsetTop + "px";
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitVisible);
        window.visualViewport.addEventListener("scroll", fitVisible);
        fitVisible();
      }

      // Ask the browser to keep the notes even when storage runs low.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

      // iPhone/iPad only show the keyboard when a text field is focused during the
      // tap itself. When a tap lands on a text area, focus the app's hidden text input now.
      document.addEventListener("touchend", (e) => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t || !wasm.folio_editable_at(t.clientX, t.clientY)) return;
        const agent = [...document.querySelectorAll("input[type=text]")].find((i) => i.getAttribute("autocapitalize") === "off");
        if (agent) agent.focus({ preventScroll: true });
      }, { capture: true, passive: true });
    }

    start().catch((e) => {
      console.error(e);
      document.getElementById("folio_loading").textContent = "Folio could not start: " + e;
    });

    // Offline support: cache the app so it opens with no connection.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("service worker:", e));
    }
  </script>
</body>
</html>
